<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif; 
            line-height: 1.6; 
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background-color: #ffffff;
            border: 1px solid #e0e0e0; 
            padding: 40px; 
            border-radius: 16px;
            text-align: center;
        }
        .header-title { color: #2E7D32; font-size: 28px; font-weight: bold; margin-bottom: 30px; }
        .divider { border-top: 1px solid #f0f0f0; margin: 20px 0 40px 0; }
        .greeting { font-size: 24px; font-weight: bold; color: #212121; margin-bottom: 20px; }
        .content-text { color: #666; font-size: 16px; margin-bottom: 20px; }
        .highlight { color: #212121; font-weight: bold; }
        .button { 
            display: inline-block; 
            padding: 15px 40px; 
            background-color: #2E7D32; 
            color: #ffffff !important; 
            text-decoration: none; 
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            margin-top: 30px;
        }
        .footer { font-size: 13px; color: #9e9e9e; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-title">Central Kitchen Management System</div>
        <div class="divider"></div>
        
        <div class="greeting">Có đơn hàng mới cần xử lý! 📦</div>
        
        <div class="content-text">
            Kính gửi bộ phận điều phối, cửa hàng <span class="highlight" th:text="${storeName}">Store Name</span> vừa gửi một đơn hàng mới.
        </div>
        
        <div style="background-color: #f8f8f8; padding: 20px; border-radius: 12px; text-align: left; margin: 20px 0;">
            <div style="margin-bottom: 10px;"><strong>Mã đơn hàng:</strong> #<span th:text="${orderId}">123</span></div>
            <div style="margin-bottom: 10px;"><strong>Ngày đặt:</strong> <span th:text="${orderDate}">2026-03-12</span></div>
        </div>
        
        <a href="http://localhost:5173/coordinator/orders" class="button">Kiểm Tra & Điều Phối</a>

        <div class="footer">
            Đây là email thông báo tự động cho Coordinator.<br/>
            Vui lòng xử lý đơn hàng sớm để đảm bảo tiến độ bếp.
        </div>
    </div>
</body>
</html>
