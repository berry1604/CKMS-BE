# Application Configuration
spring.application.name=Central Kitchen Management System

# Server
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0
# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ckms_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update 

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-here-replace-in-production}
jwt.accessExpiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION:604800000}

# OpenAPI / Swagger
springdoc.swagger-ui.enabled=true


# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Frontend URLs
app.frontend.verify-url=${FRONTEND_VERIFY_URL:http://localhost:5173/verify-email}
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}


# AhaMove Configuration
ahamove.api.base-url=${AHAMOVE_BASE_URL:https://partner-apistg.ahamove.com}
ahamove.api.key=${AHAMOVE_API_KEY:}
ahamove.api.phone=${AHAMOVE_PHONE:}
ahamove.api.name=${AHAMOVE_NAME:CKMS - Central Kitchen}
ahamove.api.callback-url=${AHAMOVE_CALLBACK_URL:}
ahamove.webhook.secret=${AHAMOVE_WEBHOOK_SECRET:CKMS}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# VNPay Sandbox Configuration
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${VNPAY_RETURN_URL}
frontend.url=${FRONTEND_URL}
frontend.vnpay-return-path=/billing/vnpay-return

# Goong Geocode v2 Configuration
goong.api.base-url=${GOONG_BASE_URL:https://rsapi.goong.io}
goong.api.key=${GOONG_API_KEY:}
goong.api.has-deprecated-administrative-unit=${GOONG_HAS_DEPRECATED_ADMINISTRATIVE_UNIT:false}
